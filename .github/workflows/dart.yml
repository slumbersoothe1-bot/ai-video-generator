name: Full Project Fix and Feature Upgrade

on:
  push:
    branches: [ main ]

jobs:
  build-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Web and iOS Configurations
        run: |
          # 1. Initialize missing web platform files
          flutter create . --org com.example.aivideogenerator --project-name ai_video_generator
          
          # 2. Ensure iOS xcscheme directory exists and fix Runner scheme
          mkdir -p ios/Runner.xcodeproj/xcshareddata/xcschemes/
          cat << 'EOF' > ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1510" version="1.3">
             <BuildAction parallelizeBuildables="1" buildImplicitDependencies="1">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="1" buildForRunning="1" buildForProfiling="1" buildForArchiving="1" buildForAnalyzing="1">
                      <BuildableReference
                         BuildableIdentifier="primary"
                         BlueprintIdentifier="97C146EF1CF900000048725D"
                         BuildableName="Runner.app"
                         BlueprintName="Runner"
                         ReferencedContainer="container:runner.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildActionForTesting="1" capable_K="1" selectedDebuggerIdentifier="Xcode.DebugDebugger.Foundation.Debugger" selectedLauncherIdentifier="Xcode.DebugLauncher.Foundation.Launcher" shouldUseLaunchSchemeArgsEnv="YES"></TestAction>
             <LaunchAction selectedDebuggerIdentifier="Xcode.DebugDebugger.Foundation.Runnable" selectedLauncherIdentifier="Xcode.DebugLauncher.Foundation.Launcher" launchStyleId="YES" useCustomWorkingDirectory="0" debugDocumentVersioning="YES" stopOnDebuggableThreads="1" allowInteraction="YES" enableLanguage="YES" enableRegion="YES"></LaunchAction>
             <MacroExpansion>
                <BuildableReference
                   BuildableIdentifier="primary"
                   BlueprintIdentifier="97C146EF1CF900000048725D"
                   BuildableName="Runner.app"
                   BlueprintName="Runner"
                   ReferencedContainer="container:runner.xcodeproj">
                </BuildableReference>
             </MacroExpansion>
          </Scheme>
          EOF

      - name: Verify Web Build Compatibility
        run: flutter build web --release

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-fix iOS/Web configs, setup AI pipeline, Stock Media & AI Bot integration"
          branch: main
